name: Build Android APK

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache=true
    -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
    -Dkotlin.incremental=true
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false
          show-progress: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cache: true
          ndk-version: '28.2.13676358'
          cmake-version: '3.31.6'

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Gradle build output
        uses: actions/cache@v4
        with:
          path: platforms/android/**/build
          key: gradle-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Cache shaderc third-party dependencies
        uses: actions/cache@v4
        with:
          path: platforms/android/app/src/main/cpp/3rdparty/shaderc/third_party
          key: shaderc-deps-${{ hashFiles('platforms/android/app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps') }}
          restore-keys: |
            shaderc-deps-

      - name: Cache CMake build objects
        uses: actions/cache@v4
        with:
          path: platforms/android/app/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('platforms/android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Cache ccache for native compilation
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache --version || sudo apt-get install -y ccache
          ccache --max-size=2G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Prepare Gradle properties
        run: |
          cat >> gradle.properties << 'EOF'

          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
          kotlin.incremental=true
          kotlin.compiler.execution.strategy=in-process
          android.enableResourceOptimizations=true
          android.enableBuildCache=true
          android.buildCacheDir=.build-cache
          android.suppressUnsupportedCompileSdk=35
          EOF

      - name: Build release APK
        id: build
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: :app:assembleRelease --stacktrace --scan --no-daemon
          build-root-directory: platforms/android
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-strict-mode: true
          gradle-home-cache-cleanup: true

      - name: Generate APK checksums
        if: success()
        run: |
          for apk in app/build/outputs/apk/**/*.apk; do
            sha256sum "$apk" > "${apk}.sha256"
            md5sum "$apk" > "${apk}.md5"
          done

      - name: Verify APK exists
        if: success()
        run: |
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" | wc -l)
          echo "Built $APK_COUNT APK(s)"
          ls -lhR app/build/outputs/apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-android-arm64
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            platforms/android/app/build/outputs/apk/**/*.sha256
            platforms/android/app/build/outputs/apk/**/*.md5
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            platforms/android/app/build/reports/
            platforms/android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  analyze:
    name: Analyze build performance
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build duration summary
        run: |
          echo "### Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.android.result }}" == "success" ]; then
            echo "| Android APK | Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.android.result }}" == "failure" ]; then
            echo "| Android APK | Failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android APK | ${{ needs.android.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on master build failure
    needs: [android]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
    steps:
      - name: Discord failure ping
        if: ${{ env.HOOK != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMITTER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          jq -n \
            --arg url "$RUN_URL" \
            --arg desc "Commit \`$SHORT_SHA\` by $COMMITTER on branch \`$BRANCH\` failed the Android build." \
            '{username:"ARMSX2 CI", embeds:[{title:"Android build broke", url:$url, color:15158332, description:$desc, footer:{text:"Check logs for details"}}]}' \
          | curl -fsSL -H 'Content-Type: application/json' -d @- "$HOOK"