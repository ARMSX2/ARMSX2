# Android-only CI pipeline — builds an APK on every push/PR to master
name: Build Android APK

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    # Make the build blocking: failing build fails the workflow
    # continue-on-error: true   # removed

    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Android SDK with NDK & CMake, caching enabled automatically
      - name: Set up Android SDK (with NDK & CMake, cached)
        uses: android-actions/setup-android@v3
        with:
          cache: true
          ndk-version: '28.2.13676358'
          cmake-version: '3.31.6'

      # Cache shaderc third-party dependencies (fetched via git-sync-deps)
      - name: Cache shaderc third-party dependencies
        uses: actions/cache@v4
        with:
          path: platforms/android/app/src/main/cpp/3rdparty/shaderc/third_party
          key: shaderc-deps-${{ hashFiles('platforms/android/app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps') }}
          restore-keys: |
            shaderc-deps-

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      # Build APK using the official Gradle action (caches Gradle wrapper, dependencies, build cache)
      - name: Build release APK (with Gradle cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: :app:assembleRelease --stacktrace
          build-root-directory: platforms/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-android-arm64
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # Optional failure notification on master (same idea as the previous PC guardrail)
  notify-failure:
    name: Notify on master build failure
    needs: [android]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
    steps:
      - name: Discord failure ping
        if: ${{ env.HOOK != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg url "$RUN_URL" \
            --arg desc "Commit \`${{ github.sha }}\` by ${{ github.actor }} failed the Android build." \
            '{username:"ARMSX2 CI", embeds:[{title:"❌ Android build broke", url:$url, color:15158332, description:$desc}]}' \
          | curl -fsSL -H 'Content-Type: application/json' -d @- "$HOOK"