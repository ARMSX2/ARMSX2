name: Android Build (Splaser Fork)

# Standalone, blocking Android build for this fork. Unlike build-all.yml this
# workflow can build any branch, tag, or commit on demand without spending CI
# time on the desktop/iOS targets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Splaser/ARMSX2 branch, tag, or commit to build"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

concurrency:
  group: android-fork-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · GitHub Release APK
    # Prevent an upstream repository or another fork from accidentally running
    # a workflow intended to check out and build Splaser's fork.
    if: ${{ github.repository == 'Splaser/ARMSX2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout Splaser/ARMSX2
        uses: actions/checkout@v7
        with:
          repository: Splaser/ARMSX2
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: platforms/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.31.6"

      # shaderc's SPIRV-Tools/glslang dependencies are fetched by its own
      # manifest and are not covered by recursive git submodules.
      - name: Fetch shaderc dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build sideloadable release APK
        run: ./gradlew :app:assembleGithubRelease --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          APK="$(find app/build/outputs/apk/github/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$APK" || { echo "No GitHub release APK was produced"; exit 1; }
          ls -lh "$APK"
          {
            echo "### Android fork build"
            echo
            echo "- Repository: \`Splaser/ARMSX2\`"
            echo "- Requested ref: \`${{ inputs.ref }}\`"
            echo "- Resolved commit: \`$(git rev-parse HEAD)\`"
            echo "- APK: \`$APK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-android-${{ github.run_number }}
          path: platforms/android/app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 14
