# Baldur's Gate: Dark Alliance (NTSC-U) — keep textures resident in the game's own
# VRAM texture cache. bmdhacks, 2026-10-14; found by the BGDA texture-upload study
# (ARMSX2 umbrella, devs/bmdhacks/campaigns/g57-bgda-slowdown/PATCH-STUDY.md).
#
# The game sweeps out every texture whose stamp is older than its render-frame
# counter, but the function that queues an already-resident texture (0x1350a8)
# refreshes the stamp from the game-time counter, which resets at level start and
# stops while paused, so it is always behind. Every texture drawn two frames running
# is evicted and uploaded again, to a different place each frame. The patch makes
# that refresh read the render-frame counter (the one the allocator at 0x1405a8 and
# the sweep at 0x140840 use).
#
# Cost it saves: on the M2, the hash cache hits 55-74% -> 66-90% across four scenes
# of the water area and the bytes ARMSX2 uploads fall 43-60%; on the RG 476H
# (Mali-G57) that area was upload-bound. Pixels: up to 53 px a frame differ by at
# most 14 levels while walking, none of it visible on the owner's flips (2026-10-14).
#
# Verified: savestate replays on the M2 (EE JIT, MTVU off, Vulkan and software
# renderers) at master f7c764dd9d; not run on a console. patches only:
# upstream's gameFixes and gsHWFixes for this serial stay in force.
SLUS-20035:
  patches:
    773A8DAB:
      content: |-
        author=bmdhacks
        comment=Keeps textures that are drawn every frame resident in the game's VRAM texture cache instead of evicting and re-uploading them (0x00135180: lw v0,-0x5bb8(gp) -> lw v0,-0x5bb4(gp)).
        patch=1,EE,00135180,word,8f82a44c

# Baldur's Gate: Dark Alliance II (NTSC-U) — the same VRAM texture-cache stamp fix as
# Dark Alliance above. bmdhacks, 2026-10-14; ARMSX2 umbrella,
# devs/bmdhacks/campaigns/g57-bgda-slowdown/PATCH-STUDY.md (BGDA II section).
#
# Same engine, same bug: the code that queues an already-resident texture (0x1f7638)
# refreshes its stamp from the game-time counter (gp-0x654c, 0x3601a4), while the
# allocator (0x2bc040) and the per-frame sweep (0x2bc2f8) use the render-frame counter
# (gp-0x6548, 0x3601a8). The patch makes the refresh read the render-frame counter.
#
# Cost it saves: over a scripted 3.3-minute session (menus, first map, walking, pause),
# hash-cache hits 48.7% -> 78.0% and texture uploads -54% (M2, EE JIT, MTVU off).
# Verified: boot-from-disc sessions on the M2 (probe build on master f7c764dd9d), no hangs or errors,
# screenshots matching at nine points; no per-pixel comparison and no console run.
# patches only: upstream's gameFixes and gsHWFixes for this serial stay in force.
SLUS-20675:
  patches:
    B0859096:
      content: |-
        author=bmdhacks
        comment=Keeps textures that are drawn every frame resident in the game's VRAM texture cache instead of evicting and re-uploading them (0x001f7640: lw v0,-0x654c(gp) -> lw v0,-0x6548(gp)).
        patch=1,EE,001f7640,word,8f829ab8

# Baldur's Gate: Dark Alliance (PAL, En/Fr/De/Es/It) — the same VRAM texture-cache stamp
# fix as the NTSC-U entry above (SLUS-20035). bmdhacks, 2026-10-14; ARMSX2 umbrella,
# devs/bmdhacks/campaigns/g57-bgda-slowdown/PATCH-STUDY.md (the NTSC-U analysis this follows).
#
# Same code, found in the PAL boot ELF (SLES_506.72) by instruction pattern, not by address.
# The three functions are the NTSC-U ones word for word except for gp offsets, data addresses
# and one jump target (gp is 0x329f70 here, 0x328a70 there). The code that queues an
# already-resident texture (0x135178) refreshes its stamp from the game-time counter
# (gp-0x5b38, 0x324438), while the allocator (0x1407e0) and the per-frame sweep (0x140a78)
# use the render-frame counter (gp-0x5b34, 0x32443c). The sweep is called right after the
# main loop increments the render-frame counter (0x2033e8), and the game-time counter is
# zeroed at 0x2027cc, 0x20376c and 0x203aa0 and skipped while a flag at gp-0x4334 is set
# (0x20305c; apparently pause). The patch makes the refresh read the render-frame counter.
#
# Cost it saves, from a scripted boot-from-disc session (title, character select, first
# street) on the M2, seven GS dumps (vsync 3500 to 7000) replayed once each on Vulkan:
# hash-cache hits 62.2% -> 75.1% and texture uploads 1970 -> 1359 (-31%). Three of the
# seven points (the later ones, after walking around) go from 49-57% to 89-91% hits and
# uploads fall 68-71%; the other four are about unchanged (uploads +1% to -15%). The two arms had identical game-time
# and render-frame counters at every 300-vsync sample, and once in play the game-time counter
# stayed 1735 behind the render-frame counter.
# Pixels: software-renderer replays of the same dumps, frames 5-11. Where two unpatched boots
# are byte-identical (five of the seven points) the patched arm differs by at most 15 px in
# three frames at one point and by 60-210 px a frame at the other four, at most 23 levels,
# singly along polygon and character edges. At the other two points the unpatched boots differ from
# each other too (hundreds of px, at most 2 levels) and the patched arm by 200-4500 px, at
# most 23 levels, so no clean figure there. Not looked at on the owner's flips.
# Verified: boot from the PAL disc on the M2 (probe build from g57-slowdown 694e23d0a3, EE
# JIT, MTVU off, isolated data path) found the entry for SLES-50672 / 4A9D8E01 and read
# 8f82a4cc at 0x135250 with it, 8f82a4c8 without. Not run: device timing, a console, other
# levels. patches only: upstream's gsHWFixes for this serial stay in force.
SLES-50672:
  patches:
    4A9D8E01:
      content: |-
        author=bmdhacks
        comment=Keeps textures that are drawn every frame resident in the game's VRAM texture cache instead of evicting and re-uploading them (0x00135250: lw v0,-0x5b38(gp) -> lw v0,-0x5b34(gp)).
        patch=1,EE,00135250,word,8f82a4cc

# GS multi-threading (backThread) recommended for the titles whose frame is limited by the GS
# thread. bmdhacks (draw-storm ARCH step 1, Claude session), 2026-10-19; ARMSX2 umbrella,
# devs/bmdhacks/campaigns/draw-storm/ARCH/STEP1-RESULT.md.
#
# What the fix does: backThread: 1 turns the GS back thread on for the game, only where the host
# has at least four performance-tier cores and a slower tier beside them
# (VMManager::Internal::CanSplitGS), and never turns it off. A player's own per-game
# GSBackThreadMode claims the setting and the database stands aside.
#
# Why these titles and not every game: the split moves the draw, texture-cache and driver half of
# the GS work to a second thread. Where the GS thread is the limit that is a large win; where the
# EE or VU1 thread is the limit it costs 1 to 13 percent, because the two extra threads compete
# for the same four big cores. Frame time, savestate in a GS-limited scene, native 1x, unlimited
# speed, median of 6 passes over two rounds, split off against split on (Android: Performance
# Cores mode, ROCKNIX: threads left to the scheduler, both with the prime-core rule of the same
# commit): Spider-Man 3 SD865 22.76 -> 20.52 ms, RG 476H 33.01 -> 30.50, RG 477V 20.86 -> 20.02,
# MQ65 87.34 -> 86.47; Sly 3 SD865 16.72 -> 12.78, RG 476H 25.74 -> 25.42, RG 477V 14.94 -> 12.15,
# MQ65 67.97 -> 59.73; Ratchet & Clank: Up Your Arsenal SD865 10.02 -> 9.29, RG 476H 16.41 ->
# 14.56, RG 477V 9.91 -> 9.72, MQ65 40.85 -> 34.96. No cell is slower with the split on.
# The hint is withheld when the IOP thread is on (VMManager::Internal::CanSplitGS asks for a fifth performance core): with it on, the split was slower
# than one GS thread on the SD865 and RG 476H in Spider-Man 3 (+4 to +5 percent), and Sly 3 gained only 1 to 4 percent.
# At 2x on the SD865 Spider-Man 3 is GPU-limited (34.8 ms either way) and Sly 3 gains 7.5 percent.
# Verified: draw-storm x1-placement build, armsx2-turnip axfl2-002 on the SD865, malisx2 0.1.5 on
# the RG 476H and RG 477V. Serials: every retail release of each title that the database lists;
# the measured ones are the NTSC-U discs (SLUS-21552, SCUS-97464, SCUS-97353).
#
# gsHWFixes is replaced wholesale, so each entry restates the upstream fixes it keeps.

# Spider-Man 3, six releases (SLUS-21552 measured). bmdhacks, 2026-10-19: backThread added to the upstream fixes.
SLUS-21552:
  gsHWFixes:
    cpuSpriteRenderBW: 2 # Fixes textures.
    cpuSpriteRenderLevel: 2 # Fixes the sun when using the above.
    halfPixelOffset: 5 # Fixes bloom alignment.
    autoFlush: 1 # Fixes bloom intensity.
    nativeScaling: 2 # Fixes DOF effect.
    backThread: 1 # GS thread is the limit in the worst scenes; see the block above.
