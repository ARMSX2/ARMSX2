# Splashdown: Rides Gone Wild -- blending accuracy held at Minimum (0) on any device that pays for
# its destination read on every draw that takes one: a copy of the render target, or a barrier.
# Source: bmdhacks. The Minimum picture was compared against the full-accuracy one
# and the difference judged acceptable.
# The cost it saves: on an SD865 under Turnip at native scale, 1,169 of Splashdown's 2,690 draws a
# frame read the render target, which on that driver's RT-copy workaround (ARMSX2 #442) is 1,192
# render passes and 1,177 target copies a frame and a 32.18 ms p95 against a 16.67 ms budget. At
# Minimum that is 24 passes, 8 copies and 23.70 ms -- 8.48 ms, 26% of the frame. At 2x it is worth
# 1.20 ms, because the frame is fill-bound by then.
# What it costs: about 30% of the frame moves, by up to 40 levels out of 255, across the water
# spray behind the boat. A tester should compare the wake against a barrier-capable device.
# Verified on: ARMSX2 ee3bc443c9 + this change, Classic Vulkan. Cap taken on the SD865/Turnip road
# and reproduced on an Apple M2 (Honeykrisp) with OverrideTextureBarriers=0.
# Widened 2026-09-22 to every road that charges for the
# destination read, which is the barrier road as well as the copy road. On an Adreno 740 the
# barrier road turns these same draws into software blends and emits 59,023 barriers a run, +40%
# on the frame; with the cap it is 1.01x the copy road with zero barriers. The M2's default road
# is a barrier road too, so a development build that loads this overlay now takes the cap there --
# measured there, the result is byte-identical to the copy road the picture was judged on. Only
# those two drivers (Turnip, Honeykrisp) count their barrier road as costly; a desktop GPU on a
# barrier road keeps its blending level even with this overlay loaded.
# copyRoadMaximumBlendingLevel is deliberately NOT maximumBlendingLevel: the cost exists only where
# we pay for the read per draw, so on a Mali with in-tile fetch, and on the Adreno declared-loop
# road the driver orders for us, the entry is inert and the picture is the one it always was.
# gsHWFixes replaces upstream's block, so upstream's autoFlush is restated beside it.
SLUS-20686:
  gsHWFixes:
    autoFlush: 1
    copyRoadMaximumBlendingLevel: 0

# Gran Turismo 4 -- asynchronous GS download mode (5).
# Source: PR #797 by Richpol99 (2026-10-04), which asked for Unsynchronized (3); changed to 5 and
# the serial list corrected by bmdhacks, 2026-10-08.
# The cost it saves: once a frame the game sums a 64x64 image into one row of a 64x8 target at
# block 0x35e0 with additive sprites, then reads that row back to the CPU. Probably a brightness
# measurement for auto-exposure. At the default mode every such read makes the EE wait for the GPU
# to finish the frame so far. The PR reports frame drops on Mali and Adreno at night and in
# bumper/cockpit view.
# Why 5 and not 3: Unsynchronized never downloads, so the game would read stale memory every frame
# and whatever the value drives would stop changing. Asynchronous downloads the real data and serves
# it a frame or two late, without waiting; an exposure loop that eases over many frames should not
# notice. To check in play: entering and leaving a tunnel, brightness should still adapt as it does
# at the default mode.
# Verified: the PR's dump (SCUS-97328, Mali-G615, a race in a tunnel) replayed with pcsx2-gsrunner
# on master e717185597, Vulkan on an Apple M2 at 1x: GPU blocking waits 6 -> 2 over the dump and all
# frames byte-identical to the default mode. A replay cannot show the game's reaction to the value,
# and the speed on a Mali or Adreno device is not measured.
# Retail GT4 serials only. Prologue, the demos, Tourist Trophy and the Nike editions are left out:
# nobody has checked they make the same readback.
# gsHWFixes replaces upstream's block, so upstream's GT4 fixes are restated beside it.
SCUS-97328:            # Gran Turismo 4 (NTSC-U)
  gsHWFixes:
    autoFlush: 1
    getSkipCount: "GSC_PolyphonyDigitalGames"
    halfPixelOffset: 4
    hwDownloadMode: 5
    recommendedBlendingLevel: 3
