# Reviewed quality-trade waivers for the Tile renderer's oracle gate (gs_oracle.py).
#
# A waiver is an explicit, reviewed decision that a scored divergence from the SW
# oracle is an accepted quality trade -- never a way to silence an unexplained diff.
# Every entry must say what the trade buys and who reviewed it. The total waiver
# count is itself a tracked risk signal: a growing list means the renderer is
# drifting from the oracle faster than trades are being won.
#
# Waivers apply to the tile arm only; gs_oracle.py ignores this file for the
# classic and sw arms, so a Classic regression can never hide behind one.
#
# Entry schema:
#   - dump: <gsname>            # dump basename without .gs[.xz|.zst]
#     frames: [3, 4]            # frame indices, or the string "all"
#     threshold: 1              # levels; the waiver allows pixels wrong by MORE than
#     max_pct: 0.5              # this, up to max_pct percent of the frame
#     reason: "why this trade is acceptable and what it buys"
#     author: <who reviewed it>
#     date: YYYY-MM-DD
#     severity: subtle          # perceptual severity at review time (see below)
#     verdict: GLOBAL TONE SHIFT
#
# The `severity` and `verdict` fields record what gs_perceptual.py said about
# the trade when a human signed it off. They are documentation, not a gate --
# gs_oracle.py reads only `threshold` and `max_pct` when deciding whether a
# waiver applies.
#
# Record them anyway. A percentage says how much moved; the verdict says what
# kind of wrong it is, and those rank differently. A waiver reading
# "63% of pixels, GLOBAL TONE SHIFT, subtle" is a defensible trade; one reading
# "3% of pixels, LOCALISED DEFECT, obvious" is a bug someone talked themselves
# into. Reviewing without that distinction is how a 4%-of-frame artifact passed
# visual review for weeks.

waivers: []
