; ENUMSX2 mobile preset specification
; These are conservative target values for integration with ARMSX2's settings layer.

[Performance]
InternalResolution=1x
PreferredRenderer=Vulkan
FallbackRenderer=OpenGLES
TextureFiltering=Basic
AnisotropicFiltering=Off
MSAA=Off
FrameSkipAvailable=true
ThermalSafe=true

[Balanced]
InternalResolution=1x
PreferredRenderer=Vulkan
FallbackRenderer=OpenGLES
TextureFiltering=Bilinear
AnisotropicFiltering=Off
MSAA=Off
FrameSkipAvailable=true
ThermalSafe=true

[Compatibility]
InternalResolution=1x
PreferredRenderer=Auto
FallbackRenderer=OpenGLES
TextureFiltering=Bilinear
AnisotropicFiltering=Off
MSAA=Off
FrameSkipAvailable=false